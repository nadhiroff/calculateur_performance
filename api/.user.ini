; .user.ini — limites PHP pour les gros fichiers (PHP en mode FPM / FastCGI : la majorité des hébergeurs)
; Lu automatiquement par PHP ; pris en compte sous 5 minutes. Doit rester à la racine du site ET dans api/.
post_max_size = 64M
upload_max_filesize = 32M
memory_limit = 1024M
max_execution_time = 600
max_input_time = -1
max_file_uploads = 20
